name: Billora CI and release

on:
  pull_request:
    branches: [main]
  push:
    # GitHub emits this event when a pull request merges into protected main.
    branches: [main]

permissions:
  contents: read

concurrency:
  group: billora-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SUPABASE_CLI_VERSION: "3.4.0"
  VERCEL_CLI_VERSION: "67.0.0"

jobs:
  build:
    name: Build and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  database:
    name: Database migrations
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - name: Replay migrations on an empty database
        run: supabase db start
      - name: Check workspace isolation and checkout
        run: |
          docker exec -i supabase_db_billora psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 \
            < supabase/tests/workspace_isolation.sql

  production:
    name: Release to production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, database]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: production
      url: ${{ steps.stage.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Check release configuration
        env:
          HAS_VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN != '' }}
          HAS_SUPABASE_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' }}
          HAS_SUPABASE_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD != '' }}
        run: |
          : "${VERCEL_ORG_ID:?Set VERCEL_ORG_ID in the GitHub production environment}"
          : "${VERCEL_PROJECT_ID:?Set VERCEL_PROJECT_ID in the GitHub production environment}"
          : "${SUPABASE_PROJECT_REF:?Set SUPABASE_PROJECT_REF in the GitHub production environment}"
          if [[ "$HAS_VERCEL_TOKEN" != true || "$HAS_SUPABASE_TOKEN" != true || "$HAS_SUPABASE_PASSWORD" != true ]]; then
            echo "::error::Add VERCEL_TOKEN, SUPABASE_ACCESS_TOKEN, and SUPABASE_DB_PASSWORD to the GitHub production environment secrets."
            exit 1
          fi
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "24"
          cache: npm
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - name: Install Vercel CLI
        run: npm install --global "vercel@$VERCEL_CLI_VERSION"
      - name: Pull and verify Vercel production settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          vercel pull --yes --environment=production
          node --env-file=.vercel/.env.production.local --input-type=module -e '
            const expected = "https://" + process.env.SUPABASE_PROJECT_REF + ".supabase.co";
            if (process.env.NEXT_PUBLIC_SUPABASE_URL?.replace(/\/$/, "") !== expected ||
                !process.env.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY?.startsWith("sb_publishable_")) {
              console.error("Configure the Vercel Production Supabase URL and publishable key for the migration target.");
              process.exit(1);
            }
          '
      - name: Build the production artifact
        run: |
          npm ci
          vercel build --prod
      - name: Stage the production deployment
        id: stage
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          deployment_url="$(vercel deploy --prebuilt --prod --skip-domain --yes)"
          DEPLOYMENT_URL="$deployment_url" node --input-type=module -e '
            const url = new URL(process.env.DEPLOYMENT_URL);
            if (url.protocol !== "https:" || url.origin !== process.env.DEPLOYMENT_URL ||
                !url.hostname.endsWith(".vercel.app")) process.exit(1);
          '
          printf 'url=%s\n' "$deployment_url" >> "$GITHUB_OUTPUT"
      - name: Confirm this commit is still at the head of main
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          if [[ "$current_sha" == "$GITHUB_SHA" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "A newer commit is on main. Its run will handle production." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Apply pending Supabase migrations
        if: steps.head.outputs.current == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --remote="$SUPABASE_PROJECT_REF" --skip-vault --yes
      - name: Promote the staged deployment
        if: steps.head.outputs.current == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOYMENT_URL: ${{ steps.stage.outputs.url }}
        run: |
          node --input-type=module <<'JS'
          import { setTimeout as wait } from "node:timers/promises";

          const { DEPLOYMENT_URL, VERCEL_ORG_ID, VERCEL_PROJECT_ID, VERCEL_TOKEN } = process.env;
          const scope = new URLSearchParams({ teamId: VERCEL_ORG_ID });

          // The CLI promote command looks up the user, which a scoped CI token cannot do.
          async function vercel(path, method = "GET") {
            const response = await fetch(`https://api.vercel.com${path}?${scope}`, {
              method,
              headers: { Authorization: `Bearer ${VERCEL_TOKEN}` },
              signal: AbortSignal.timeout(15_000),
            });
            if (!response.ok) {
              throw new Error(`Vercel ${method} ${path} failed (HTTP ${response.status}).`);
            }
            if (method === "GET") return response.json();
          }

          const hostname = new URL(DEPLOYMENT_URL).hostname;
          const deployment = await vercel(`/v13/deployments/${encodeURIComponent(hostname)}`);
          if ((deployment.projectId ?? deployment.project?.id) !== VERCEL_PROJECT_ID ||
              deployment.target !== "production" ||
              (deployment.readyState ?? deployment.state) !== "READY" ||
              !/^dpl_[a-zA-Z0-9]+$/.test(deployment.id)) {
            throw new Error("The staged deployment is not ready for promotion in the configured project.");
          }

          await vercel(`/v10/projects/${encodeURIComponent(VERCEL_PROJECT_ID)}/promote/${deployment.id}`, "POST");

          // A build staged with --skip-domain can keep an empty alias field after promotion.
          const aliasesPath = `/v2/deployments/${deployment.id}/aliases`;
          const deadline = Date.now() + 60_000;
          let { aliases } = await vercel(aliasesPath);
          while (!aliases.length && Date.now() < deadline) {
            await wait(2_000);
            ({ aliases } = await vercel(aliasesPath));
          }
          if (!aliases.length) {
            throw new Error("Vercel did not assign production domains to the staged deployment.");
          }
          console.log(`Production domains assigned to ${deployment.id}.`);
          JS
